<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - JobBoard</title>

    <link rel="stylesheet" href="proj.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">

                <i class="fa-solid fa-briefcase"></i>
                JobBoard

            </div>


            <h1>Create Account</h1>

            <p>
                Register to find your perfect job
            </p>


            <form id="registerForm">


                <!-- Full Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <!-- Education -->

                <label for="education">
                    Education
                </label>

                <input
                    type="text"
                    id="education"
                    placeholder="e.g. B.Tech Computer Science"
                    required
                >


                <!-- Qualification -->

                <label for="qualification">
                    Qualification
                </label>

                <input
                    type="text"
                    id="qualification"
                    placeholder="e.g. Bachelor's Degree"
                    required
                >


                <!-- Skills -->

                <label for="skills">
                    Skills
                </label>

                <input
                    type="text"
                    id="skills"
                    placeholder="e.g. HTML, CSS, JavaScript"
                    required
                >


                <!-- Experience -->

                <label for="experience">
                    Experience
                </label>

                <select id="experience" required>

                    <option value="">
                        Select Experience
                    </option>

                    <option value="fresher">
                        Fresher
                    </option>

                    <option value="0-1">
                        0 - 1 Year
                    </option>

                    <option value="1-3">
                        1 - 3 Years
                    </option>

                    <option value="3-5">
                        3 - 5 Years
                    </option>

                    <option value="5+">
                        5+ Years
                    </option>

                </select>


                <!-- Register Button -->

                <button type="submit">
                    Register
                </button>


            </form>


            <div class="auth-links">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>


                <a href="proj.html">
                    ← Back to JobBoard
                </a>

            </div>


        </div>

    </div>
<script>
document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:3000/api/auth/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            alert("Registration successful!");
            window.location.href = "login.html";
        } else {
            alert(data.message);
        }

    } catch (error) {
        alert("Cannot connect to server.");
        console.error(error);
    }
});
</script>

</body>

</html>
